# Relayed through OpenRouter. Price and limits: https://hashference.com/models/openai-gpt-4o-mini and https://hashference.com/v1/catalog (credits per million tokens; 1,000 credits = $1).
# Capabilities follow providers/openrouter/models/openai/gpt-4o-mini.toml: Hashference forwards tools, response_format and the raw reasoning object,
# and maps reasoning_effort to OpenRouter's reasoning.effort for none|minimal|low|medium|high|xhigh only.
# Prompt caching: cache_control markers are removed, so there are no explicit cache writes; automatic caching is billed at the cached-input price.
# APIs: Chat Completions and Responses, checked live 2026-11-02.
schema = 2
base_model = "openai/gpt-4o-mini"

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 0.18
cache = { read = 0.09 }

[cost.text.output]
price = 0.72

[api.chat-completions]

[api.responses]
base_url = "https://hashference.com/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }
