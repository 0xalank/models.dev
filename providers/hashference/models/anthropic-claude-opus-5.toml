# Relayed through OpenRouter. Price and limits: https://hashference.com/models/anthropic-claude-opus-5 and https://hashference.com/v1/catalog (credits per million tokens; 1,000 credits = $1).
# Capabilities follow providers/openrouter/models/anthropic/claude-opus-5.toml: Hashference forwards tools, response_format and the raw reasoning object,
# and maps reasoning_effort to OpenRouter's reasoning.effort for none|minimal|low|medium|high|xhigh only (max is not forwarded, so it is left out).
# Prompt caching: cache_control markers are removed, so there are no explicit cache writes, and this model caches only explicitly.
# APIs: Chat Completions and Messages (same model ID), checked live 2026-11-02.
schema = 2
base_model = "anthropic/claude-opus-5"

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true
cache = false

[cost.text.input]
price = 6

[cost.text.output]
price = 30

[api.chat-completions]

[api.messages]
base_url = "https://hashference.com/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }
